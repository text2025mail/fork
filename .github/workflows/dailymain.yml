name: BMS DailyBO 1to9 + Combine (Matrix)

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  actions: read   # ✅ REQUIRED for precheck

jobs:

# =====================================================
# 0️⃣ PRECHECK (NEW — SAFE ADD)
# =====================================================
  precheck:
    name: Skip if another run active
    runs-on: ubuntu-latest

    steps:
      - name: Check running workflows
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "dailymain.yml",
              status: "in_progress"
            });

            const otherRuns = runs.data.workflow_runs.filter(r => r.id !== context.runId);

            if (otherRuns.length > 0) {
              console.log("🚫 Another run is already running. Skipping this run.");
              process.exit(1);
            }

# =====================================================
# 1️⃣ SHARDS
# =====================================================
  shards:
    name: Shard ${{ matrix.shard }}
    needs: precheck   # ✅ ONLY ADDITION HERE
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8,9]

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🌐 Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
          rm -f google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: 📦 Install dependencies
        run: |
          pip install selenium webdriver-manager cloudscraper aiohttp pytz

      - name: 🚀 Run shard scraper
        run: python bmsdaily${{ matrix.shard }}.py
        env:
          WORKER_UA: ${{ secrets.WORKER_UA }}
          WORKER_KEY: ${{ secrets.WORKER_KEY }}

      - name: 💾 Commit & push shard data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add daily/
          git commit -m "Daily BMS shard ${{ matrix.shard }} ($(date +'%Y-%m-%d %H:%M'))" || exit 0

          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push origin main && exit 0
            sleep 3
          done

          git push --force-with-lease origin main || true

# =====================================================
# 2️⃣ COMBINER
# =====================================================
  combine:
    name: Combine all shards (Safe)
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: bms-combiner
      cancel-in-progress: false

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔁 Safe combine + push (retry loop)
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          MAX_TRIES=6
          TRY=1

          while [ $TRY -le $MAX_TRIES ]; do
            echo "🔁 Combine attempt $TRY / $MAX_TRIES"

            git fetch origin main
            git reset --hard origin/main

            pip install pytz
            python combine_dailyshards.py

            git add daily/

            if git diff --cached --quiet; then
              echo "✅ No changes after combine"
              exit 0
            fi

            git commit -m "Final combined BMS data ($(date -u +'%Y-%m-%d %H:%M UTC'))"

            if git push origin main; then
              echo "✅ Combine push successful"
              exit 0
            fi

            echo "⚠ Push failed — main moved. Retrying..."
            TRY=$((TRY+1))
            sleep 5
          done

          echo "❌ Combine failed after $MAX_TRIES attempts"
          exit 1

# =====================================================
# 3️⃣ RETRY COMBINE
# =====================================================
  retry-combine:
    name: Auto retry combiner
    needs: combine
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Trigger workflow again
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "dailymain.yml",
              ref: "main"
            });
