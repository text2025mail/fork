name: BMS TmrwAdv 1–9 + Combine (Matrix | HARD SAFE)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0,2,4,6,8,10,12,14,16 * * *"

permissions:
  contents: write
  actions: read

# ❌ REMOVE GLOBAL CONCURRENCY (IMPORTANT)
# precheck will handle skipping properly

jobs:

# =====================================================
# 0️⃣ PRECHECK (FIXED — REAL SKIP LOGIC)
# =====================================================
  precheck:
    name: Skip if another run active
    runs-on: ubuntu-latest

    steps:
      - name: Check running workflows
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "main.yml"
            });

            const activeRuns = runs.data.workflow_runs.filter(r =>
              (r.status === "in_progress" || r.status === "queued") &&
              r.id !== context.runId
            );

            if (activeRuns.length > 0) {
              console.log("🚫 Another run active/queued. Skipping.");
              process.exit(1);
            }

# =====================================================
# 1️⃣ SHARDS
# =====================================================
  shards:
    name: Shard ${{ matrix.shard }}
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8,9]

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 🔄 Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🌐 Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
          rm -f google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: 📦 Install dependencies
        run: |
          pip install selenium webdriver-manager cloudscraper aiohttp pytz

      - name: 🚀 Run shard scraper
        env:
          SHARD_ID: ${{ matrix.shard }}
          WORKER_UA: ${{ secrets.WORKER_UA }}
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
        run: python bms${{ matrix.shard }}.py

      - name: 💾 Commit & push shard data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add advance/
          git commit -m "BMS shard ${{ matrix.shard }} ($(date +'%Y-%m-%d %H:%M IST'))" || exit 0

          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git push origin main && exit 0
            echo "Retry push $i..."
            sleep 4
          done

          git push --force-with-lease origin main || true

# =====================================================
# 2️⃣ COMBINER
# =====================================================
  combine:
    name: Combine all shards (SAFE)
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: bms-tmrwadv-combiner
      cancel-in-progress: false

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 🔄 Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install deps
        run: pip install pytz

      - name: 🔁 Safe combine + push
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          MAX_TRIES=6
          TRY=1

          while [ $TRY -le $MAX_TRIES ]; do

            echo "🔁 Combine attempt $TRY / $MAX_TRIES"

            git fetch origin main
            git reset --hard origin/main

            python combine_shards.py

            git add advance/

            if git diff --cached --quiet; then
              echo "✅ No changes after combine"
              exit 0
            fi

            git commit -m "Final combined BMS data ($(date +'%Y-%m-%d %H:%M IST'))"

            if git push origin main; then
              echo "✅ Combine push successful"
              exit 0
            fi

            echo "⚠ Push failed — main moved. Retrying..."
            TRY=$((TRY+1))
            sleep 5

          done

          echo "❌ Combine failed after $MAX_TRIES attempts"
          exit 1

# =====================================================
# 3️⃣ AUTO RE-RUN COMBINER
# =====================================================
  retry-combine:
    name: Auto re-run combiner
    needs: combine
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Trigger workflow again
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "main.yml",
              ref: "main"
            });
